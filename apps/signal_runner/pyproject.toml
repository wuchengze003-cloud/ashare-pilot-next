[project]
name = "ashare-signal-runner"
version = "0.1.0"
description = "Deterministic production target publisher"
requires-python = ">=3.11"
dependencies = [
  "ashare-quant-core",
  "jsonschema[format]>=4.25,<5"
]

[tool.uv.sources]
ashare-quant-core = {workspace = true}

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"
