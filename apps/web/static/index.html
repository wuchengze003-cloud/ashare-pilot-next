<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A 股策略影子运行</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="nav">
    <div><div class="eyebrow">只读生产视图</div><h1>A 股策略影子运行</h1></div>
    <div id="state-badge" class="badge">加载中</div>
  </header>
  <main>
    <section class="notice">
      <strong>模拟运行，不是实际券商账户。</strong>
      本页只展示已提交的目标仓位和模拟账户状态，不表示已下单、已成交或真实持仓。
    </section>
    <section>
      <div class="section-head"><h2>本次决策</h2><span id="as-of" class="muted"></span></div>
      <div id="signal-cards" class="cards"></div>
      <h3>目标仓位</h3>
      <div class="table-wrap"><table><thead><tr><th>股票</th><th class="right">目标权重</th></tr></thead><tbody id="targets"></tbody></table></div>
      <p id="reason-codes" class="muted"></p>
    </section>
    <section>
      <div class="section-head"><h2>模拟账户</h2><span id="account-id" class="muted"></span></div>
      <div id="account-cards" class="cards"></div>
      <h3>模拟持仓</h3>
      <div class="table-wrap"><table><thead><tr>
        <th>股票</th><th class="right">股数</th><th class="right">T+1 锁定</th>
        <th class="right">模拟成本</th><th class="right">估值价</th><th class="right">市值</th>
        <th class="right">目标权重</th><th>估值状态</th>
      </tr></thead><tbody id="holdings"></tbody></table></div>
    </section>
    <section>
      <h2>当日模拟成交与跳过项</h2>
      <div class="table-wrap"><table><thead><tr>
        <th>日期</th><th>股票</th><th>方向</th><th class="right">股数</th>
        <th class="right">价格</th><th class="right">费用</th><th>原因</th>
      </tr></thead><tbody id="trades"></tbody></table></div>
      <ul id="skips" class="skip-list"></ul>
    </section>
    <section><h2>可追溯信息</h2><dl id="provenance" class="provenance"></dl></section>
  </main>
  <footer>只读快照 · 目标仓位不等于订单 · 模拟持仓不等于真实持仓</footer>
  <script src="app.js" defer></script>
</body>
</html>
