[project]
name = "ashare-research-app"
version = "0.1.0"
description = "Experiment, race, evaluation, and promotion application"
requires-python = ">=3.11"
dependencies = [
    "arch>=8.0,<9",
    "ashare-quant-core",
    "numpy>=2.0,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "jsonschema[format]>=4.25,<5",
]

[project.scripts]
ashare-research-run = "ashare_research_app.pilot_research:main"
ashare-champion-activate = "ashare_research_app.activate:main"
ashare-model-race = "ashare_research_app.model_race:main"

[tool.uv.sources]
ashare-quant-core = {workspace = true}

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"
