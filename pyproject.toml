[project]
name = "ashare-pilot-next-workspace"
version = "0.1.0"
description = "Clean architecture workspace for reproducible A-share research and signals"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema[format]>=4.25,<5",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1"
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/quant_core",
  "packages/obs",
  "apps/research",
  "apps/sim_account",
  "apps/signal_runner",
  "services/data_gateway"
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = [
  "packages/quant_core/tests",
  "packages/obs/tests",
  "services/data_gateway/tests",
  "apps/research/tests",
  "apps/sim_account/tests",
  "apps/signal_runner/tests",
  "tools/tests"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
